name: Verificação Diária de Atualizações e Segurança

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'package-lock.json'

jobs:
  check-updates-and-security:
    name: Checagem de Segurança e Dependências
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Ambiente Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Instalar Dependências para Análise
      run: npm install

    - name: 1. Verificar Vulnerabilidades Atuais (SCA)
      run: |
        echo "=== RELATÓRIO DE AUDITORIA DE SEGURANÇA ===" > relatorio-seguranca.txt
        date >> relatorio-seguranca.txt
        echo "----------------------------------------" >> relatorio-seguranca.txt
        npm audit --audit-level=high >> relatorio-seguranca.txt 2>&1 || true
      # O '>> relatorio-seguranca.txt 2>&1' joga todo o texto e possíveis erros dentro do arquivo txt

    - name: 2. Verificar Pacotes Desatualizados
      run: |
        echo "" >> relatorio-seguranca.txt
        echo "=== RELATÓRIO DE PACOTES DESATUALIZADOS ===" >> relatorio-seguranca.txt
        echo "----------------------------------------" >> relatorio-seguranca.txt
        npm outdated >> relatorio-seguranca.txt 2>&1 || true

    - name: 3. Disponibilizar Relatório para Download (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: relatorio-dependencias-seguranca
        path: relatorio-seguranca.txt
        retention-days: 7
        # O arquivo fica guardado no GitHub por 7 dias para você baixar quando quiser
