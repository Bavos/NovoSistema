name: Testes E2E (Fluxo do Usuário)

# ==========================================
# GATILHOS (TRIGGERS) DO WORKFLOW
# ==========================================
on:
  # 1. Gatilho Manual: Permite rodar a automação pelo celular clicando em "Run workflow" no GitHub
  workflow_dispatch:

  # 2. Gatilho de Segurança: Roda automaticamente sempre que um Pull Request for aberto para a main
  pull_request:
    branches: [ main ]

  # 3. Gatilho de Push: Roda quando o código for enviado direto para a main (mas ignora arquivos de texto/docs)
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'

jobs:
  e2e-testing:
    name: Simulação de Navegação
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Ambiente Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Instalar Dependências do Projeto
      run: npm install

    - name: Instalar Navegador (Chromium) para o Playwright
      run: npx playwright install --with-deps chromium

    - name: Executar Testes Fim-a-Fim
      run: npx playwright test

    - name: Disponibilizar Relatório e Vídeo de Falhas (Artifact)
      if: always() # Garante que o relatório seja gerado mesmo que o teste de login falhe
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
