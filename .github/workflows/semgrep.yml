name: Semgrep Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST & Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Instala e roda o Semgrep CLI diretamente, garantindo a gravação do arquivo
      - name: Run Semgrep and Save Report
        run: |
          python3 -m pip install --upgrade pip
          pip3 install semgrep
          semgrep scan --config "p/security-audit" --config "p/secrets" --config "p/typescript" --config "p/owasp-top-ten" --sarif --output semgrep.sarif || true

      - name: Upload Security Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-security-report
          path: semgrep.sarif
          retention-days: 14
