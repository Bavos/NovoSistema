name: React DevSecOps CI

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]

jobs:
  security-and-build:
    name: Auditoria, Segurança e Compilação
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Garante o histórico completo para a varredura de segredos

    - name: Configurar Ambiente Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Substitua pela versão estável do seu projeto
        cache: 'npm'

    - name: Instalar Dependências de Forma Segura
      run: npm ci
      # O 'npm ci' garante instalações limpas e idênticas ao package-lock.json

    - name: Verificar Vulnerabilidades em Pacotes (SCA)
      run: npm audit --audit-level=high
      # O pipeline falha imediatamente se houver pacotes alucinados ou vulnerabilidades graves

    - name: Análise Estática de Código (SAST Linter)
      run: npm run lint
      # Valida as regras do eslint-plugin-security e react-hooks

    - name: Executar Suite de Testes Unitários
      run: npm test -- --watchAll=false --ci
      env:
        CI: 'true'

    - name: Validar Compilação de Produção (Build)
      run: npm run build
      # Garante que as otimizações do React/Vite/Next não quebram em produção

    - name: Verificar Vazamento de Segredos (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Bloqueia o PR se encontrar tokens, chaves Stripe/AWS hardcoded criadas pela IA
# trigger pipeline update
