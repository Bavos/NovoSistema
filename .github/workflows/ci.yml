name: React DevSecOps CI

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]

jobs:
  security-and-build:
    name: Auditoria, Segurança e Compilação
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Garante o histórico completo para a varredura de segredos

    - name: Configurar Ambiente Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' 
        cache: 'npm'

    - name: Instalar Dependências de Forma Segura
      run: npm ci

    - name: Verificar Vulnerabilidades em Pacotes (SCA)
      run: npm audit --audit-level=high

    - name: Análise Estática de Código (SAST Linter)
      run: npm run lint

    - name: Executar Suite de Testes Unitários
      run: npm test

    - name: Validar Compilação de Produção (Build)
      run: npm run build

    - name: Verificar Vazamento de Segredos (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
